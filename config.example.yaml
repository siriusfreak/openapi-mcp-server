# Example configuration file for OpenAPI MCP Server
# Copy this file to config.yaml and modify as needed

# List of OpenAPI specifications to load
# Can be local files or URLs
specs:
  - https://petstore.swagger.io/v2/swagger.json
  - ./local-api.yaml
  # - https://api.github.com/swagger.json
  # - https://raw.githubusercontent.com/APIs-guru/openapi-directory/main/APIs/stripe.com/2020-08-27/openapi.yaml

# Server mode: "stdio" for local integration, "http" for remote access
mode: http

# Port for HTTP server (only used when mode is "http")
port: 3000

# Log level: debug, info, warn, error
log_level: info

